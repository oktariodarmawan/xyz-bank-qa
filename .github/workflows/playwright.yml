name: Playwright Tests

# Manual trigger only. This suite runs against the shared, mutable live demo
# site (not a sandbox), so it is deliberately NOT run automatically on every
# push — that would keep mutating real data and could clash with runs
# triggered from elsewhere. Add a `push`/`pull_request` trigger later only if
# the target changes to an isolated test environment.
on:
  workflow_dispatch: {}

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set run timestamp
        run: echo "RUN_STAMP=$(date -u +'%Y%m%d-%H%M%S')-UTC" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Write run summary
        if: always()
        run: |
          {
            echo "### Playwright test run"
            echo ""
            echo "- **Date/time (UTC):** $(date -u +'%Y-%m-%d %H:%M:%S')"
            echo "- **Triggered by:** ${{ github.actor }}"
            echo "- **Branch:** ${{ github.ref_name }}"
            echo "- **Commit:** ${{ github.sha }}"
            echo ""
            echo "Download the \`playwright-report-${{ env.RUN_STAMP }}\` artifact below and open \`index.html\` for the full results."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ env.RUN_STAMP }}
          path: playwright-report/
          retention-days: 14

      - name: Upload failure traces/screenshots/videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ env.RUN_STAMP }}
          path: test-results/
          retention-days: 14
